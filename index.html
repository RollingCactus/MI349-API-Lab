
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Find YOUR favorite Pokemon!</h1>

    <div class="search-container">
        <input
            type="text"
            id="pokemonName"
            placeholder="Enter Pokemon Name"
        >

        <button onclick="fetchData()">Search Pokemon</button>
    </div>

    <div id="pokemonInfo">

        <h2 id="name"></h2>

        <img
            src=""
            alt="Pokemon Sprite"
            id="pokemonSprite"
            style="display: none;"
        >

        <div id="stats"></div>

        <h2>Pokemon Locations</h2>

        <div id="locations">
            Search for a Pokemon to find its locations!
        </div>

    </div>

    <script src="./index.js"></script>

</body>
</html>
